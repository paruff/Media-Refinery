name: Release

# A v* tag on main (matching pyproject.toml) builds ONE multi-arch image with provenance and an
# SBOM, pushes it under a candidate tag, gates that exact digest on the compose smoke test and
# Trivy (0 critical, both architectures), then promotes the same digest to <version> / latest.
on:
  push:
    tags: ["v*.*.*"]

permissions: {}

jobs:
  publish:
    name: Build, smoke, scan, promote
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # origin/main is needed to prove the tag is on main
      - name: Tag guard (version tag, matches pyproject.toml, on main)
        id: guard
        env:
          REF_NAME: ${{ github.ref_name }}
        run: scripts/release_guard.sh "$REF_NAME"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image name and version
        env:
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "IMAGE=ghcr.io/${REPO,,}"
            echo "VERSION=${REF_NAME#v}"
            echo "CANDIDATE=candidate-${SHA}"
          } >> "$GITHUB_ENV"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the one multi-arch image (candidate tag only)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE }}:${{ env.CANDIDATE }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
      - name: Compose smoke on that digest (amd64)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          docker tag "$IMAGE@$DIGEST" media-refinery:ci
          scripts/smoke.sh media-refinery:ci
      - name: Trivy, amd64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: v0.76.1
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy, arm64
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: v0.76.1
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Promote the tested digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          LATEST: ${{ steps.guard.outputs.latest }}
        run: |
          tags="-t $IMAGE:$VERSION"
          if [ "$LATEST" = "true" ]; then tags="$tags -t $IMAGE:latest"; fi
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags "$IMAGE@$DIGEST"
