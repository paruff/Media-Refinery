name: Release

# A v* tag builds the image, gates it on the compose smoke test and Trivy
# (0 critical), then publishes ghcr.io/<owner>/media-refinery:<version>.
on:
  push:
    tags: ["v*.*.*"]

permissions: {}

jobs:
  publish:
    name: Build, smoke, scan, publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image name and version
        env:
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "IMAGE=ghcr.io/${REPO,,}" >> "$GITHUB_ENV"
          echo "VERSION=${REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: media-refinery:ci
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
      - name: Compose smoke (one fixture per media type)
        run: scripts/smoke.sh media-refinery:ci
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: media-refinery:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
