[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "media_refinery"
version = "0.3.0-rc.2"
description = "Self-hosted, non-destructive media normalizer: watches a drop folder and converts music, audiobooks, movies, TV and ebooks to one verified canonical format per type, then publishes to Plex, Jellyfin, Audiobookshelf or Calibre."
readme = "README.md"
requires-python = ">=3.14"
license = {file = "LICENSE"}
authors = [{name = "Phil Ruff"}]
keywords = ["media", "ffmpeg", "plex", "jellyfin", "audiobookshelf", "calibre", "self-hosted", "normalization"]
classifiers = [
	"Development Status :: 4 - Beta",
	"Environment :: Web Environment",
	"Framework :: FastAPI",
	"Intended Audience :: End Users/Desktop",
	"License :: OSI Approved :: MIT License",
	"Programming Language :: Python :: 3.14",
	"Topic :: Multimedia",
]

[project.urls]
Homepage = "https://github.com/paruff/Media-Refinery"
Documentation = "https://github.com/paruff/Media-Refinery/tree/main/docs"
Issues = "https://github.com/paruff/Media-Refinery/issues"


dependencies = [
	"pydantic>=2.0",
	"typer>=0.9.0",
	"rich>=13.0.0",
	"pytest>=7.0.0",
	"fastapi>=0.110.0",
	"uvicorn>=0.29.0",
	"pydantic-settings>=2.2.1",
	"sqlalchemy>=2.0.0",
	"aiosqlite>=0.20.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--strict-markers"
testpaths = ["tests"]

# ---------------------------------------------------------------------------
# Lint / format: ONE config shared by the editor, pre-commit and CI.
# Tool versions are pinned in .pre-commit-config.yaml (single source of truth).
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
	"E", "W",   # pycodestyle
	"F",        # pyflakes
	"I",        # isort
	"B",        # bugbear
	"UP",       # pyupgrade
	"S",        # bandit (security)
	"ASYNC",    # blocking calls in async code
	"DTZ",      # naive datetimes
	"C4",       # comprehensions
	"SIM",      # simplifications
	"RUF",      # ruff-specific
	"T20",      # stray print()
	"LOG",      # logging misuse
	"PIE", "PGH", "PLE", "PLW", "TID", "FLY",
	"C901", "PLR0915",  # complexity: default limits (10 branches, 50 statements) (G18)
]
ignore = [
	"E501",     # line length is the formatter's job
	"S603",     # subprocess with list args is our required pattern (R-SAFE-5)
	"PLW1510",  # explicit check= is reviewed case by case
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# pre-G18 hot spots, outside the orchestrator: split them, then drop the entry
"examples/audio_format_detection_example.py" = ["PLR0915"]
"app/core/scanner.py" = ["C901", "PLR0915"]
"app/services/auditor.py" = ["C901"]
"app/services/classification.py" = ["C901", "PLR0915"]
"app/services/execution_service.py" = ["PLR0915"]
"app/services/musicbrainz.py" = ["C901", "PLR0915"]
"app/services/tagging_service.py" = ["C901"]
"app/services/tmdb.py" = ["C901", "PLR0915"]
"tests/corpus/test_crash_invariants.py" = ["C901"]
"tests/features/steps/fingerprinting_steps.py" = ["C901"]
"tests/unit/test_ffmpeg_transcoding.py" = ["C901"]
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "S607", "ASYNC", "T20", "PLW0603"]
"features/**" = ["S101", "T20", "F811"]
"scripts/**" = ["T20", "S607"]
"run_refinery.py" = ["S104"]  # daemon binds 0.0.0.0 inside the container

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.bandit]
exclude_dirs = ["tests", "features", ".venv", "alembic/versions"]

[tool.codespell]
skip = "*.lock,*.sqlite,coverage.xml,./.git,./testdata,./sample_media,./docs/legacy"
ignore-words-list = "ser,te,fo,nd,ot,ans,astroid"
check-hidden = false

[project.scripts]
refinery = "app.cli:app"

[tool.setuptools.packages.find]
include = ["app*"]
