services:
  media-refinery:
    build: .
    image: media-refinery:latest
    container_name: media-refinery
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ${INPUT_DIR:-./input}:/input
      - ${OUTPUT_DIR:-./output}:/output
      - ${WORK_DIR:-./work}:/work
      - ${DATA_DIR:-./data}:/data
    ports:
      - "8000:8000"
    restart: unless-stopped
